name: 실거래가 수집

on:
  schedule:
    # 매일 오전 7시 13분(KST). 국토부 자료는 하루 한 번 갱신된다.
    - cron: "13 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - run: pip install -r requirements-collect.txt

      # 지난 달 이전 자료는 다시 받지 않도록 API 응답 캐시를 유지한다.
      - uses: actions/cache@v4
        with:
          path: data/rtms.sqlite
          key: rtms-${{ github.run_id }}
          restore-keys: rtms-

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/market.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실거래가 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
